<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Где искать — Фильмы и Сериалы</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000000;
    --bg-card: #111111;
    --bg-card-hover: #1a1a1a;
    --border: #222222;
    --text: #ffffff;
    --text-muted: #888888;
    --accent: #ff5c00;
    --green: #1db954;
    --green-soft: #1db95420;
    --yellow: #f5c518;
    --yellow-soft: #f5c51820;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 60px;
  }
  
  /* ШАПКА */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); padding: 14px 24px;
  }
  .header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  
  .logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .logo-text { font-family: 'Press Start 2P', monospace; font-size: 20px; color: #fff; line-height: 1; }
  .logo-box { background: var(--accent); color: #000; font-family: 'Press Start 2P', monospace; font-size: 16px; padding: 8px 14px; border-radius: 8px; line-height: 1; }

  .search-box { flex: 1; min-width: 240px; position: relative; }
  .search-box input {
    width: 100%; padding: 11px 16px 11px 42px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text); font-size: 15px; outline: none; transition: 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

  /* КНОПКА КВИЗА */
  .quiz-banner {
    max-width: 1400px; margin: 20px auto 0; padding: 0 24px;
  }
  .quiz-btn {
    width: 100%; padding: 16px; background: linear-gradient(90deg, #ff5c00, #ff8c00);
    border: none; border-radius: 12px; color: #000; font-size: 18px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .quiz-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 92, 0, 0.4); }

  /* ТАБЫ И ЖАНРЫ */
  .tabs { max-width: 1400px; margin: 0 auto; padding: 14px 24px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 18px; border-radius: 100px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-size: 14px;
    cursor: pointer; font-weight: 600; transition: 0.2s;
  }
  .tab-btn:hover { border-color: #555; color: var(--text); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .genres-bar {
    max-width: 1400px; margin: 0 auto; padding: 14px 24px 0;
    display: flex; gap: 8px; flex-wrap: wrap; max-height: 120px; overflow-y: auto;
  }
  .genre-chip {
    padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); font-size: 13px;
    cursor: pointer; transition: 0.2s;
  }
  .genre-chip:hover { border-color: #555; color: var(--text); }
  .genre-chip.active { background: var(--text); border-color: var(--text); color: #000; font-weight: 600; }

  /* СЕТКА */
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .section-title .count { font-size: 14px; font-weight: 400; color: var(--text-muted); }
  
  .support-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); cursor: pointer; transition: 0.2s; }
  .support-btn:hover { border-color: var(--accent); color: var(--accent); }

  .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  
  .movie-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; transition: 0.2s;
  }
  .movie-card:hover { transform: translateY(-3px); border-color: #333; background: var(--bg-card-hover); }
  .card-top { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 10px; }
  .movie-title { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .movie-year { color: var(--text-muted); font-size: 13px; white-space: nowrap; padding-top: 2px; }
  
  .movie-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .meta-tag { font-size: 12px; color: var(--text-muted); background: #222; padding: 2px 8px; border-radius: 4px; }
  
  .badges-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 4px; font-weight: 600; }
  .badge.free { background: var(--green-soft); color: var(--green); }
  .badge.sub { background: var(--yellow-soft); color: var(--yellow); }

  .links-block { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .link-row {
    display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; 
    border-radius: 6px; background: #000; border: 1px solid var(--border); 
    text-decoration: none; color: var(--text); font-size: 13px; transition: 0.2s;
  }
  .link-row:hover { border-color: #555; }
  .link-row.free-link { border-color: #1db95440; }
  .link-row.free-link .service-name { color: var(--green); }
  .service-type { color: var(--text-muted); font-size: 11px; }

  /* МОДАЛКА ПОДДЕРЖКИ */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 460px; width: 100%; }
  .modal h3 { margin-bottom: 6px; font-size: 18px; }
  .modal p { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #000; color: #fff; font-family: inherit; outline: none; }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; flex: 1; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: #333; color: #fff; }

  /* ========================================= */
  /* СТИЛИ ДЛЯ КВИЗА */
  /* ========================================= */
  .quiz-overlay {
    position: fixed; inset: 0; background: #000; z-index: 2000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto;
  }
  .quiz-overlay.open { display: flex; }
  
  .quiz-container {
    width: 100%; max-width: 600px; text-align: center;
  }
  .quiz-step { display: none; animation: fadeIn 0.3s ease; }
  .quiz-step.active { display: block; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .quiz-title { font-size: 24px; font-weight: 800; margin-bottom: 30px; line-height: 1.3; }
  
  .quiz-options { display: flex; flex-direction: column; gap: 12px; }
  .quiz-option {
    padding: 16px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: 0.2s; text-align: left;
  }
  .quiz-option:hover { border-color: var(--accent); background: var(--bg-card-hover); }
  
  .quiz-close {
    position: absolute; top: 20px; right: 20px; background: transparent;
    border: none; color: #888; font-size: 30px; cursor: pointer;
  }

  .quiz-result-grid {
    display: flex; flex-direction: column; gap: 16px; margin-top: 20px;
    text-align: left;
  }
  .quiz-restart {
    margin-top: 30px; padding: 12px 24px; background: transparent;
    border: 1px solid var(--border); color: #fff; border-radius: 8px;
    cursor: pointer; font-size: 14px;
  }

  @media (max-width: 640px) {
    .movies-grid { grid-template-columns: 1fr; }
    .logo-text { font-size: 16px; }
    .logo-box { font-size: 12px; padding: 6px 10px; }
    .quiz-title { font-size: 20px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-text">ГДЕ</span>
      <span class="logo-box">искать</span>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск фильмов и сериалов...">
    </div>
  </div>
</header>

<!-- Кнопка запуска квиза -->
<div class="quiz-banner">
  <button class="quiz-btn" id="startQuizBtn">🎲 Подобрать кино на вечер по настроению</button>
</div>

<div class="tabs" id="tabsBar">
  <button class="tab-btn active" data-tab="all">Все</button>
  <button class="tab-btn" data-tab="free">🟢 Бесплатно</button>
  <button class="tab-btn" data-tab="paid">💰 Платно</button>
</div>

<div class="genres-bar" id="genresBar"></div>

<main class="container">
  <div class="section-header">
    <div class="section-title">
      <span id="sectionLabel">Все фильмы</span>
      <span class="count" id="countLabel"></span>
    </div>
    <button class="support-btn" id="supportBtn">✉️ Не нашли фильм?</button>
  </div>
  <div class="movies-grid" id="moviesGrid"></div>
</main>

<!-- МОДАЛКА ПОДДЕРЖКИ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Сообщить о фильме</h3>
    <p>Напишите нам, и мы добавим его в базу.</p>
    <form id="supportForm">
      <div class="form-group">
        <label>Название *</label>
        <input type="text" name="title" required placeholder="Например: Интерстеллар">
      </div>
      <div class="form-group">
        <label>Комментарий</label>
        <textarea name="comment" rows="3"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modalCancel">Отмена</button>
        <button type="submit" class="btn btn-primary">Отправить</button>
      </div>
    </form>
  </div>
</div>

<!-- ========================================= -->
<!-- ИНТЕРФЕЙС КВИЗА -->
<!-- ========================================= -->
<div class="quiz-overlay" id="quizOverlay">
  <button class="quiz-close" id="closeQuizBtn">×</button>
  <div class="quiz-container">
    
    <!-- Шаг 1 -->
    <div class="quiz-step active" id="step1">
      <div class="quiz-title">Какое у тебя сейчас настроение?</div>
      <div class="quiz-options">
        <button class="quiz-option" onclick="nextStep(2, 'sad')">😢 Грустное</button>
        <button class="quiz-option" onclick="nextStep(2, 'happy')">😄 Весёлое</button>
        <button class="quiz-option" onclick="nextStep(2, 'anxious')">😰 Тревожное</button>
        <button class="quiz-option" onclick="nextStep(2, 'angry')">😡 Раздражённое</button>
        <button class="quiz-option" onclick="nextStep(2, 'inspired')">🤩 Воодушевлённое</button>
      </div>
    </div>

    <!-- Шаг 2 -->
    <div class="quiz-step" id="step2">
      <div class="quiz-title" id="q2Title">Почему?</div>
      <div class="quiz-options" id="q2Options"></div>
    </div>

    <!-- Шаг 3 -->
    <div class="quiz-step" id="step3">
      <div class="quiz-title">Что хочешь получить от фильма?</div>
      <div class="quiz-options">
        <button class="quiz-option" onclick="nextStep(4, 'comedy')">Отвлечься и посмеяться</button>
        <button class="quiz-option" onclick="nextStep(4, 'drama')">Поплакать и выпустить эмоции</button>
        <button class="quiz-option" onclick="nextStep(4, 'family')">Поверить в чудо</button>
        <button class="quiz-option" onclick="nextStep(4, 'thriller')">Пощекотать нервы</button>
        <button class="quiz-option" onclick="nextStep(4, 'blockbuster')">Залипнуть на красивую картинку</button>
      </div>
    </div>

    <!-- Шаг 4 -->
    <div class="quiz-step" id="step4">
      <div class="quiz-title">С кем смотришь?</div>
      <div class="quiz-options">
        <button class="quiz-option" onclick="nextStep(5, 'alone')">Один</button>
        <button class="quiz-option" onclick="nextStep(5, 'couple')">С девушкой/парнем</button>
        <button class="quiz-option" onclick="nextStep(5, 'friends')">С друзьями</button>
        <button class="quiz-option" onclick="nextStep(5, 'family')">С родителями</button>
      </div>
    </div>

    <!-- Шаг 5 -->
    <div class="quiz-step" id="step5">
      <div class="quiz-title">Насколько ты устал?</div>
      <div class="quiz-options">
        <button class="quiz-option" onclick="finishQuiz('light')">Очень, хочу просто фон</button>
        <button class="quiz-option" onclick="finishQuiz('normal')">Нормально, готов на 2 часа</button>
        <button class="quiz-option" onclick="finishQuiz('heavy')">Полон сил, готов на всю ночь</button>
      </div>
    </div>

    <!-- Результат -->
    <div class="quiz-step" id="stepResult">
      <div class="quiz-title" style="margin-bottom:10px;">Твои фильмы на вечер:</div>
      <p style="color:#888; margin-bottom:20px;">Мы подобрали 3 варианта под твоё состояние.</p>
      <div class="quiz-result-grid" id="quizResultGrid"></div>
      <button class="quiz-restart" onclick="resetQuiz()">Пройти заново</button>
    </div>

  </div>
</div>


<script>
// ==========================================
// БАЗА ДАННЫХ (С РАСШИРЕННЫМИ ЖАНРАМИ)
// ==========================================
const DB = [
  // Комедии
  { title: "Холоп", year: 2019, country: "Россия", genres: ["комедия"], moods: ["sad","happy","angry"], free: [], sub: [{name: "START", url: "https://start.ru"}] },
  { title: "Джентльмены", year: 2019, country: "Великобритания", genres: ["криминал","комедия"], moods: ["happy","angry"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Друзья", year: 1994, country: "США", genres: ["комедия"], moods: ["sad","anxious"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  
  // Драмы
  { title: "Слово пацана. Кровь на асфальте", year: 2023, country: "Россия", genres: ["драма","криминал"], moods: ["angry","sad"], free: [], sub: [{name: "Wink", url: "https://wink.ru"}] },
  { title: "Побег из Шоушенка", year: 1994, country: "США", genres: ["драма"], moods: ["sad","inspired"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Зелёная миля", year: 1999, country: "США", genres: ["драма","фэнтези"], moods: ["sad"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  
  // Боевики / Триллеры
  { title: "Джон Уик", year: 2014, country: "США", genres: ["боевик","триллер"], moods: ["angry"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Т-34", year: 2019, country: "Россия", genres: ["боевик","военный"], moods: ["inspired","angry"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Очень странные дела", year: 2016, country: "США", genres: ["фантастика","ужасы"], moods: ["anxious"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  
  // Романтика / Семейное
  { title: "Титаник", year: 1997, country: "США", genres: ["мелодрама","драма"], moods: ["sad","inspired"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Амели", year: 2001, country: "Франция", genres: ["мелодрама","комедия"], moods: ["sad","inspired"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Гарри Поттер", year: 2001, country: "Великобритания", genres: ["фэнтези","семейный"], moods: ["anxious","inspired"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  
  // Аниме / Мультики
  { title: "Унесённые призраками", year: 2001, country: "Япония", genres: ["аниме","фэнтези"], moods: ["anxious","inspired"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Тайна Коко", year: 2017, country: "США", genres: ["мультфильм","семейный"], moods: ["sad","inspired"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Шрек", year: 2001, country: "США", genres: ["мультфильм","комедия"], moods: ["sad","angry"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  
  // Классика СССР
  { title: "Иван Васильевич меняет профессию", year: 1973, country: "СССР", genres: ["комедия"], moods: ["sad","anxious"], free: [{name: "Смотрим", url: "https://smotrim.ru"}], sub: [] },
  { title: "Служебный роман", year: 1977, country: "СССР", genres: ["мелодрама","комедия"], moods: ["sad","inspired"], free: [{name: "Смотрим", url: "https://smotrim.ru"}], sub: [] },
  
  // Фантастика
  { title: "Интерстеллар", year: 2014, country: "США", genres: ["фантастика","драма"], moods: ["inspired","anxious"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] },
  { title: "Матрица", year: 1999, country: "США", genres: ["фантастика","боевик"], moods: ["angry","inspired"], free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}] }
];

// ==========================================
// ЛОГИКА ОСНОВНОГО САЙТА
// ==========================================
let state = { search: "", genre: "all", tab: "all" };
const genresBar = document.getElementById("genresBar");
const moviesGrid = document.getElementById("moviesGrid");
const searchInput = document.getElementById("searchInput");
const sectionLabel = document.getElementById("sectionLabel");
const countLabel = document.getElementById("countLabel");
const tabsBar = document.getElementById("tabsBar");

function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
const allGenres = [...new Set(DB.flatMap(m => m.genres))].sort();

genresBar.innerHTML = `<button class="genre-chip active" data-genre="all">Все жанры</button>` + 
  allGenres.map(g => `<button class="genre-chip" data-genre="${g}">${capitalize(g)}</button>`).join("");

genresBar.addEventListener("click", (e) => {
  if (!e.target.classList.contains("genre-chip")) return;
  document.querySelectorAll(".genre-chip").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.genre = e.target.dataset.genre;
  render();
});

function getFiltered() {
  const q = state.search.toLowerCase().trim();
  return DB.filter(m => {
    const matchTitle = m.title.toLowerCase().includes(q);
    const matchGenre = state.genre === "all" || m.genres.includes(state.genre);
    let matchTab = true;
    if (state.tab === "free") matchTab = m.free.length > 0;
    if (state.tab === "paid") matchTab = m.free.length === 0;
    return matchTitle && matchGenre && matchTab;
  });
}

function renderCards(list) {
  return list.map(m => {
    let badges = "";
    if (m.free.length) badges += `<span class="badge free">Бесплатно</span>`;
    if (m.sub.length) badges += `<span class="badge sub">По подписке</span>`;
    let links = [
      ...m.free.map(s => `<a class="link-row free-link" href="${s.url}" target="_blank"><span class="service-name">${s.name}</span><span class="service-type">бесплатно</span></a>`),
      ...m.sub.map(s => `<a class="link-row" href="${s.url}" target="_blank"><span class="service-name">${s.name}</span><span class="service-type">подписка</span></a>`)
    ].join("");
    return `
      <div class="movie-card">
        <div class="card-top">
          <div class="movie-title">${m.title}</div>
          <div class="movie-year">${m.year}</div>
        </div>
        <div class="movie-meta">
          <span class="meta-tag">${m.country}</span>
          ${m.genres.slice(0,2).map(g => `<span class="meta-tag">${capitalize(g)}</span>`).join("")}
        </div>
        <div class="badges-row">${badges}</div>
        <div class="links-block">${links}</div>
      </div>`;
  }).join("");
}

function render() {
  const list = getFiltered();
  if (state.tab === "free") sectionLabel.textContent = "Бесплатные";
  else if (state.tab === "paid") sectionLabel.textContent = "Платные";
  else if (state.genre !== "all") sectionLabel.textContent = `Жанр: ${capitalize(state.genre)}`;
  else sectionLabel.textContent = "Все фильмы";
  countLabel.textContent = `(${list.length})`;

  if (list.length === 0) {
    moviesGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#888;">Ничего не найдено 😕</div>`;
    return;
  }
  moviesGrid.innerHTML = renderCards(list);
}

searchInput.addEventListener("input", (e) => { state.search = e.target.value; render(); });
tabsBar.addEventListener("click", (e) => {
  if (!e.target.classList.contains("tab-btn")) return;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.tab = e.target.dataset.tab;
  render();
});

// ==========================================
// ЛОГИКА КВИЗА
// ==========================================
let quizAnswers = { mood: '', reason: '', goal: '', company: '', energy: '' };
const quizOverlay = document.getElementById("quizOverlay");
const q2Options = document.getElementById("q2Options");
const q2Title = document.getElementById("q2Title");

document.getElementById("startQuizBtn").onclick = () => {
  quizOverlay.classList.add("open");
  resetQuiz();
};
document.getElementById("closeQuizBtn").onclick = () => {
  quizOverlay.classList.remove("open");
};

function nextStep(stepNum, value) {
  // Записываем ответ в зависимости от шага
  if (stepNum === 2) {
    quizAnswers.mood = value;
    buildStep2(value); // Генерируем 2-й вопрос
  }
  if (stepNum === 4) quizAnswers.goal = value;
  if (stepNum === 5) quizAnswers.company = value;
  if (stepNum === 6) quizAnswers.reason = value; 

  document.querySelectorAll(".quiz-step").forEach(el => el.classList.remove("active"));
  if (stepNum <= 5) {
    document.getElementById("step" + stepNum).classList.add("active");
  }
}

// Генерация 2-го вопроса в зависимости от настроения
function buildStep2(mood) {
  let optionsHTML = "";
  if (mood === 'sad') {
    q2Title.textContent = "Почему грустное?";
    optionsHTML = `
      <button class="quiz-option" onclick="nextStep(3, 'work')">Из-за работы/учебы</button>
      <button class="quiz-option" onclick="nextStep(3, 'love')">Из-за отношений</button>
      <button class="quiz-option" onclick="nextStep(3, 'tired')">Просто устал</button>
      <button class="quiz-option" onclick="nextStep(3, 'nothing')">Без причины</button>`;
  } else if (mood === 'anxious') {
    q2Title.textContent = "Почему тревожное?";
    optionsHTML = `
      <button class="quiz-option" onclick="nextStep(3, 'future')">Из-за будущего</button>
      <button class="quiz-option" onclick="nextStep(3, 'news')">Из-за новостей</button>
      <button class="quiz-option" onclick="nextStep(3, 'money')">Из-за денег</button>`;
  } else if (mood === 'angry') {
    q2Title.textContent = "Что бесит?";
    optionsHTML = `
      <button class="quiz-option" onclick="nextStep(3, 'people')">Люди вокруг</button>
      <button class="quiz-option" onclick="nextStep(3, 'work')">Работа/бытовуха</button>
      <button class="quiz-option" onclick="nextStep(3, 'unfair')">Несправедливость</button>`;
  } else {
    q2Title.textContent = "Что послужило причиной?";
    optionsHTML = `
      <button class="quiz-option" onclick="nextStep(3, 'good_day')">Просто хороший день</button>
      <button class="quiz-option" onclick="nextStep(3, 'success')">Хочу закрепить успех</button>`;
  }
  q2Options.innerHTML = optionsHTML;
  document.querySelectorAll(".quiz-step").forEach(el => el.classList.remove("active"));
  document.getElementById("step2").classList.add("active");
}

// Завершение квиза и показ результатов
function finishQuiz(energy) {
  quizAnswers.energy = energy;
  document.querySelectorAll(".quiz-step").forEach(el => el.classList.remove("active"));
  
  // Логика подбора
  // В реальности здесь должен быть сложный алгоритм, но пока сделаем базовый скоринг
  let scoredDB = DB.map(movie => {
    let score = 0;
    // Совпадение по настроению (moods)
    if (movie.moods && movie.moods.includes(quizAnswers.mood)) score += 5;
    
    // Совпадение по жанру (goal)
    if (quizAnswers.goal === 'comedy' && movie.genres.includes('комедия')) score += 3;
    if (quizAnswers.goal === 'drama' && movie.genres.includes('драма')) score += 3;
    if (quizAnswers.goal === 'family' && movie.genres.includes('семейный')) score += 3;
    if (quizAnswers.goal === 'thriller' && movie.genres.includes('триллер')) score += 3;
    if (quizAnswers.goal === 'blockbuster' && (movie.genres.includes('фантастика') || movie.genres.includes('боевик'))) score += 3;

    return { ...movie, score };
  });

  // Сортируем по убыванию очков и берем топ-3
  scoredDB.sort((a, b) => b.score - a.score);
  const top3 = scoredDB.slice(0, 3);

  const resultGrid = document.getElementById("quizResultGrid");
  resultGrid.innerHTML = renderCards(top3);

  document.getElementById("stepResult").classList.add("active");
}

function resetQuiz() {
  quizAnswers = { mood: '', reason: '', goal: '', company: '', energy: '' };
  document.querySelectorAll(".quiz-step").forEach(el => el.classList.remove("active"));
  document.getElementById("step1").classList.add("active");
}

// Старт основного сайта
render();
</script>
</body>
