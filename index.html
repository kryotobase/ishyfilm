<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Где искать — Фильмы и Сериалы</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000000; --bg-card: #111111; --bg-card-hover: #1a1a1a;
    --border: #222222; --text: #ffffff; --text-muted: #888888;
    --accent: #ff5c00; --green: #1db954; --green-soft: #1db95420;
    --yellow: #f5c518; --yellow-soft: #f5c51820;
    --red: #ff3333;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
  
  .header { position: sticky; top: 0; z-index: 100; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 14px 24px; }
  .header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .logo-text { font-family: 'Press Start 2P', monospace; font-size: 20px; color: #fff; line-height: 1; }
  .logo-box { background: var(--accent); color: #000; font-family: 'Press Start 2P', monospace; font-size: 16px; padding: 8px 14px; border-radius: 8px; line-height: 1; }

  .search-box { flex: 1; min-width: 240px; position: relative; }
  .search-box input { width: 100%; padding: 11px 16px 11px 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 15px; outline: none; transition: 0.2s; }
  .search-box input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

  .quiz-banner { max-width: 1400px; margin: 20px auto 0; padding: 0 24px; }
  .quiz-btn { width: 100%; padding: 16px; background: linear-gradient(90deg, #ff5c00, #ff8c00); border: none; border-radius: 12px; color: #000; font-size: 18px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.2s, box-shadow 0.2s; }
  .quiz-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 92, 0, 0.4); }

  .tabs { max-width: 1400px; margin: 0 auto; padding: 14px 24px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .tab-btn { padding: 8px 18px; border-radius: 100px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 14px; cursor: pointer; font-weight: 600; transition: 0.2s; }
  .tab-btn:hover { border-color: #555; color: var(--text); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .section-title .count { font-size: 14px; font-weight: 400; color: var(--text-muted); }

  .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .movie-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; gap: 12px; transition: 0.2s; position: relative; }
  .movie-card:hover { transform: translateY(-3px); border-color: #333; background: var(--bg-card-hover); }
  
  .movie-poster { width: 90px; height: 135px; border-radius: 8px; object-fit: cover; background: #222; flex-shrink: 0; }
  .movie-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .movie-title { font-size: 15px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
  .movie-year { color: var(--text-muted); font-size: 12px; margin-bottom: 6px; }
  .movie-desc { font-size: 12px; color: #aaa; line-height: 1.3; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .movie-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .meta-tag { font-size: 10px; color: var(--text-muted); background: #222; padding: 2px 6px; border-radius: 4px; }
  .badges-row { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .badge.free { background: var(--green-soft); color: var(--green); }
  .badge.sub { background: var(--yellow-soft); color: var(--yellow); }
  .links-block { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  .link-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 6px; background: #000; border: 1px solid var(--border); text-decoration: none; color: var(--text); font-size: 12px; transition: 0.2s; }
  .link-row:hover { border-color: #555; }
  .link-row.free-link { border-color: #1db95440; }
  .link-row.free-link .service-name { color: var(--green); }
  .service-type { color: var(--text-muted); font-size: 10px; }

  .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: 0.2s; z-index: 10; color: #fff; }
  .fav-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.1); }
  .fav-btn.active { color: var(--red); }

  .load-more-btn { display: block; width: 100%; max-width: 300px; margin: 30px auto; padding: 14px; background: var(--bg-card); border: 1px solid var(--border); color: #fff; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .load-more-btn:hover { border-color: var(--accent); color: var(--accent); }

  .error-box { grid-column: 1/-1; text-align: center; padding: 40px; color: #ff5c00; background: #1a0000; border: 1px solid #ff3333; border-radius: 12px; margin: 20px; }
  .error-box small { display: block; margin-top: 10px; color: #aaa; font-size: 12px; }

  @media (max-width: 640px) {
    .movies-grid { grid-template-columns: 1fr; }
    .logo-text { font-size: 16px; }
    .logo-box { font-size: 12px; padding: 6px 10px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-text">ГДЕ</span>
      <span class="logo-box">искать</span>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск фильмов и сериалов...">
    </div>
  </div>
</header>

<div class="quiz-banner">
  <button class="quiz-btn" id="startQuizBtn">🎲 Подобрать кино на вечер по настроению</button>
</div>

<div class="tabs" id="tabsBar">
  <button class="tab-btn active" data-tab="all">Все</button>
  <button class="tab-btn" data-tab="free">🟢 Бесплатно</button>
  <button class="tab-btn" data-tab="paid">💰 Платно</button>
  <button class="tab-btn" data-tab="favorites">❤️ Избранное</button>
</div>

<main class="container">
  <div class="section-header">
    <div class="section-title">
      <span id="sectionLabel">Все фильмы</span>
      <span class="count" id="countLabel"></span>
    </div>
  </div>
  <div class="movies-grid" id="moviesGrid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:#888;">Загрузка базы фильмов из kino.is...</div>
  </div>
  <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Загрузить еще</button>
</main>

<script>
// ==========================================
// НАСТРОЙКИ
// ==========================================
let DB = [];
let state = { search: "", tab: "all" };
let currentPage = 1;

const moviesGrid = document.getElementById("moviesGrid");
const searchInput = document.getElementById("searchInput");
const sectionLabel = document.getElementById("sectionLabel");
const countLabel = document.getElementById("countLabel");
const tabsBar = document.getElementById("tabsBar");
const loadMoreBtn = document.getElementById("loadMoreBtn");

// Избранное
let favorites = JSON.parse(localStorage.getItem('movieFavorites')) || [];
function toggleFavorite(title, btn) {
  const idx = favorites.indexOf(title);
  if (idx === -1) { favorites.push(title); btn.classList.add('active'); btn.innerHTML = '❤️'; }
  else { favorites.splice(idx, 1); btn.classList.remove('active'); btn.innerHTML = '🤍'; }
  localStorage.setItem('movieFavorites', JSON.stringify(favorites));
  if (state.tab === 'favorites') render();
}

// ==========================================
// ЗАГРУЗКА ИЗ KINO.IS (ЧЕРЕЗ ПРЯМОЙ FETCH)
// ==========================================
async function fetchMovies(page = 1) {
  try {
    loadMoreBtn.textContent = "Загрузка...";
    loadMoreBtn.disabled = true;

    // Прямой запрос к API kino.is для каталога
    // Согласно документации, чтение открытое. Пробуем эндпоинт /api/catalog
    const url = `https://kino.is/api/catalog?page=${page}&lang=ru`;
    const response = await fetch(url);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();
    
    // Ищем массив фильмов в ответе (структура может быть разной)
    // Если API возвращает объект с полем films, items или results
    let rawMovies = data.films || data.items || data.results || [];
    
    // Если это массив напрямую
    if (Array.isArray(data)) rawMovies = data;

    if (rawMovies.length === 0) {
      throw new Error("API вернул пустой список фильмов. Возможно, изменилась структура ответа.");
    }

    const newMovies = rawMovies.map(m => {
      // Адаптация под разные варианты имен полей
      const title = m.title || m.name || m.original_title || 'Без названия';
      const year = m.year || (m.release_date ? m.release_date.split('-')[0] : '—');
      const description = m.description || m.overview || m.synopsis || 'Описание отсутствует...';
      const poster = m.poster || m.poster_url || m.image || (m.poster_path ? `https://image.tmdb.org/t/p/w200${m.poster_path}` : 'https://via.placeholder.com/90x135/222/555?text=Нет+фото');
      
      let genres = [];
      if (m.genres && Array.isArray(m.genres)) {
        genres = m.genres.map(g => typeof g === 'string' ? g : (g.name || g.title)).filter(Boolean);
      }
      if (m.genre_ids && Array.isArray(m.genre_ids)) {
        const GENRE_MAP = {28:"боевик",12:"приключения",16:"мультфильм",35:"комедия",80:"криминал",99:"документальный",18:"драма",10751:"семейный",14:"фэнтези",36:"история",27:"ужасы",10402:"музыка",9648:"детектив",10749:"мелодрама",878:"фантастика",53:"триллер",10752:"военный"};
        genres = m.genre_ids.map(id => GENRE_MAP[id]).filter(Boolean);
      }

      return {
        title, year, country: m.country || 'Мир', genres: genres.length ? genres : ['разное'],
        description, poster, free: [], sub: [{name: "Кинопоиск", url: "https://hd.kinopoisk.ru"}]
      };
    });

    if (page === 1) DB = newMovies;
    else DB = [...DB, ...newMovies];

    render();
    loadMoreBtn.style.display = "block";
    loadMoreBtn.textContent = "Загрузить еще";
    loadMoreBtn.disabled = false;

  } catch (e) {
    console.error("Ошибка kino.is:", e);
    moviesGrid.innerHTML = `<div class="error-box">Ошибка загрузки из kino.is<br><small>${e.message}</small><br><small style="margin-top:10px;color:#fff;">Попробуйте обновить страницу позже.</small></div>`;
    loadMoreBtn.style.display = "none";
  }
}

// ==========================================
// РЕНДЕР
// ==========================================
function renderCards(list) {
  return list.map(m => {
    let badges = "";
    if (m.free && m.free.length) badges += `<span class="badge free">Бесплатно</span>`;
    if (m.sub && m.sub.length) badges += `<span class="badge sub">По подписке</span>`;
    let links = [
      ...(m.free || []).map(s => `<a class="link-row free-link" href="${s.url}" target="_blank"><span class="service-name">${s.name}</span><span class="service-type">бесплатно</span></a>`),
      ...(m.sub || []).map(s => `<a class="link-row" href="${s.url}" target="_blank"><span class="service-name">${s.name}</span><span class="service-type">подписка</span></a>`)
    ].join("");
    const isFav = favorites.includes(m.title);
    const favBtnClass = isFav ? 'fav-btn active' : 'fav-btn';
    const favIcon = isFav ? '❤️' : '🤍';
    const safeTitle = m.title.replace(/'/g, "\\'");
    return `
      <div class="movie-card">
        <button class="${favBtnClass}" onclick="event.stopPropagation(); toggleFavorite('${safeTitle}', this)">${favIcon}</button>
        <img src="${m.poster}" class="movie-poster" alt="Постер" onerror="this.src='https://via.placeholder.com/90x135/222/555?text=Нет+фото'">
        <div class="movie-content">
          <div class="movie-title">${m.title}</div>
          <div class="movie-year">${m.year} · ${m.country}</div>
          <div class="movie-desc">${m.description}</div>
          <div class="movie-meta">${m.genres.slice(0,2).map(g => `<span class="meta-tag">${g}</span>`).join("")}</div>
          <div class="badges-row">${badges}</div>
          <div class="links-block">${links}</div>
        </div>
      </div>`;
  }).join("");
}

function render() {
  const q = state.search.toLowerCase().trim();
  let list = DB.filter(m => {
    const matchTitle = m.title.toLowerCase().includes(q);
    let matchTab = true;
    if (state.tab === "free") matchTab = m.free && m.free.length > 0;
    if (state.tab === "paid") matchTab = (!m.free || m.free.length === 0);
    if (state.tab === "favorites") matchTab = favorites.includes(m.title);
    return matchTitle && matchTab;
  });

  sectionLabel.textContent = state.tab === "favorites" ? "Избранное" : "Каталог kino.is";
  countLabel.textContent = `(${list.length})`;
  if (list.length === 0) { moviesGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#888;">Ничего не найдено 😕</div>`; return; }
  moviesGrid.innerHTML = renderCards(list);
}

// Слушатели
searchInput.addEventListener("input", (e) => { state.search = e.target.value; render(); });
tabsBar.addEventListener("click", (e) => {
  if (!e.target.classList.contains("tab-btn")) return;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.tab = e.target.dataset.tab;
  render();
});
loadMoreBtn.addEventListener("click", () => { currentPage++; fetchMovies(currentPage); });

// Старт
fetchMovies(1);
</script>
</body>
</html>
